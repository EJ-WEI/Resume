<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="bezier.title">Bezier Curve — EJ</title>
<meta name="description" data-i18n="bezier.description" data-i18n-attr="content" content="An interactive Bezier curve / De Casteljau construction visualizer, built into EJ's resume site">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/bezier.css">
</head>
<body data-page="bezier" data-base="../">
<div class="wrap">

  <nav class="topnav" id="site-nav"></nav>

  <section data-reveal style="margin-top:12px;">
    <div class="sec-head">
      <span class="sec-num">09</span>
      <h2 class="sec-title" data-i18n="bezier.heading">Bezier Curve Construction</h2>
      <div class="sec-rule"></div>
    </div>

    <div class="panel-frame">
      <div class="controls-row">
        <div class="point-stepper">
          <button class="print-btn stepper-btn" id="remove-point-btn" data-i18n="bezier.removePoint" data-i18n-attr="aria-label" aria-label="Remove a control point">&minus;</button>
          <span class="run-status" id="point-count"></span>
          <button class="print-btn stepper-btn" id="add-point-btn" data-i18n="bezier.addPoint" data-i18n-attr="aria-label" aria-label="Add a control point">+</button>
        </div>
      </div>

      <div class="t-control">
        <label for="t-slider">t</label>
        <input type="range" id="t-slider" class="t-slider" min="0" max="1" step="0.001" value="0.5">
        <span class="run-status" id="t-value"></span>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="legend-swatch hull"></span><span data-i18n="bezier.hull">Control polygon</span></span>
        <span class="legend-item"><span class="legend-swatch curve"></span><span data-i18n="bezier.curve">Curve</span></span>
        <span class="legend-item"><span class="legend-swatch construct"></span><span data-i18n="bezier.construct">De Casteljau step</span></span>
        <span class="legend-item"><span class="legend-swatch point-t"></span><span data-i18n="bezier.pointAtT">Point at t</span></span>
      </div>

      <div class="bezier-canvas-wrap">
        <canvas id="bezier-canvas" width="720" height="460"></canvas>
      </div>

      <p class="hint" data-i18n="bezier.hint">Drag a point to move it, double-click a point to remove it, or use the +/&minus; buttons to change how many there are (minimum 2).</p>
    </div>
  </section>

  <footer id="site-footer"></footer>

</div>

<script src="../js/i18n.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/bezier.js"></script>
</body>
</html>
