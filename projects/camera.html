<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="camera.title">Camera — EJ</title>
<meta name="description" data-i18n="camera.description" data-i18n-attr="content" content="A live camera preview, built into EJ's resume site">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/camera.css">
</head>
<body data-page="camera" data-base="../">
<div class="wrap">

  <nav class="topnav" id="site-nav"></nav>

  <section data-reveal style="margin-top:12px;">
    <div class="sec-head">
      <span class="sec-num">07</span>
      <h2 class="sec-title" data-i18n="camera.heading">Optical Sensor</h2>
      <div class="sec-rule"></div>
    </div>

    <div class="panel-frame">
      <div class="panel-hud">
        <div class="spec"><div class="k" data-i18n="camera.status">STATUS</div><div class="v" id="cam-status" data-i18n="camera.idle">Idle</div></div>
      </div>

      <div class="cam-wrap">
        <video id="cam-video" autoplay playsinline muted></video>
        <div class="overlay show" id="cam-overlay">
          <p class="eyebrow" id="cam-title" data-i18n="camera.off">CAMERA OFF</p>
          <p class="muted" id="cam-msg" data-i18n="camera.offMsg">Grant camera access to begin live capture. Nothing leaves your browser.</p>
          <button class="print-btn" id="cam-enable" data-i18n="camera.enable">Enable Camera</button>
        </div>
      </div>

      <div class="cam-controls">
        <button class="print-btn" id="cam-capture" data-i18n="camera.capture" disabled>Capture Frame</button>
        <button class="print-btn" id="cam-stop" data-i18n="camera.stop" disabled>Stop Camera</button>
        <a class="print-btn" id="cam-download" href="#" download="capture.png" data-i18n="camera.download" hidden>Download</a>
      </div>

      <canvas id="cam-canvas" hidden></canvas>
      <div class="cam-snapshot" id="cam-snapshot-wrap" hidden>
        <p class="eyebrow" data-i18n="camera.lastCapture">LAST CAPTURE</p>
        <img id="cam-snapshot" data-i18n="camera.alt" data-i18n-attr="alt" alt="Captured frame">
      </div>

      <p class="hint" data-i18n="camera.hint">Camera access is requested only when you click Enable, the stream stays local, and it stops the moment you leave this page.</p>
    </div>
  </section>

  <footer id="site-footer"></footer>

</div>

<script src="../js/i18n.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/camera.js"></script>
</body>
</html>
