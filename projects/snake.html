<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="snake.title">Snake — EJ</title>
<meta name="description" data-i18n="snake.description" data-i18n-attr="content" content="A snake game, built into EJ's resume site">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/snake.css">
</head>
<body data-page="snake" data-base="../">
<div class="wrap">

  <nav class="topnav" id="site-nav"></nav>

  <section data-reveal style="margin-top:12px;">
    <div class="sec-head">
      <span class="sec-num">06</span>
      <h2 class="sec-title" data-i18n="snake.heading">Self-Test — Snake</h2>
      <div class="sec-rule"></div>
    </div>

    <div class="panel-frame">
      <div class="panel-hud">
        <div class="spec"><div class="k" data-i18n="snake.score">SCORE</div><div class="v" id="score">0</div></div>
        <div class="spec"><div class="k" data-i18n="snake.highScore">HIGH SCORE</div><div class="v" id="highscore">0</div></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="overlay show" id="overlay">
          <p class="eyebrow" id="overlay-title" data-i18n="snake.ready">READY</p>
          <p class="muted" id="overlay-msg" data-i18n="snake.readyMsg">Press start, an arrow key, or WASD</p>
          <button class="print-btn" id="start-btn" data-i18n="snake.start">Start</button>
        </div>
      </div>

      <div class="dpad">
        <button data-dir="0,-1" data-i18n="snake.up" data-i18n-attr="aria-label" aria-label="Up">↑</button>
        <button data-dir="-1,0" data-i18n="snake.left" data-i18n-attr="aria-label" aria-label="Left">←</button>
        <button data-dir="0,1" data-i18n="snake.down" data-i18n-attr="aria-label" aria-label="Down">↓</button>
        <button data-dir="1,0" data-i18n="snake.right" data-i18n-attr="aria-label" aria-label="Right">→</button>
      </div>

      <p class="hint" data-i18n="snake.hint">Arrow keys / WASD to steer · space to start · swipe on mobile</p>
    </div>
  </section>

  <footer id="site-footer"></footer>

</div>

<script src="../js/i18n.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/snake.js"></script>
</body>
</html>
