<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bezier Curve — EJ</title>
<meta name="description" content="An interactive Bezier curve / De Casteljau construction visualizer, built into EJ's resume site">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bezier.css">
</head>
<body>
<div class="wrap">

  <nav class="topnav">
    <a href="index.html" class="brand">EJ</a>
    <div class="nav-links">
      <a href="index.html">Resume</a>
      <a href="snake.html">Snake</a>
      <a href="camera.html">Camera</a>
      <a href="astar.html">A*</a>
      <a href="bezier.html" class="active">Bezier</a>
    </div>
  </nav>

  <section data-reveal style="margin-top:12px;">
    <div class="sec-head">
      <span class="sec-num">09</span>
      <h2 class="sec-title">Bezier Curve Construction</h2>
      <div class="sec-rule"></div>
    </div>

    <div class="panel-frame">
      <div class="controls-row">
        <button class="print-btn" id="add-point-btn">+ Add Point</button>
        <span class="run-status" id="point-count"></span>
      </div>

      <div class="t-control">
        <label for="t-slider">t</label>
        <input type="range" id="t-slider" class="t-slider" min="0" max="1" step="0.001" value="0.5">
        <span class="run-status" id="t-value"></span>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="legend-swatch hull"></span>Control polygon</span>
        <span class="legend-item"><span class="legend-swatch curve"></span>Curve</span>
        <span class="legend-item"><span class="legend-swatch construct"></span>De Casteljau step</span>
        <span class="legend-item"><span class="legend-swatch point-t"></span>Point at t</span>
      </div>

      <div class="bezier-canvas-wrap">
        <canvas id="bezier-canvas" width="720" height="460"></canvas>
      </div>

      <p class="hint">Drag a point to move it, double-click a point to remove it, or add more with the button above.</p>
    </div>
  </section>

  <footer>
    <span>REV. 2026-08 · BUILT AS A STATIC PAGE</span>
  </footer>

</div>

<script src="js/main.js"></script>
<script src="js/bezier.js"></script>
</body>
</html>
